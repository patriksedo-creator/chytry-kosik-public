<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Chytrý košík: mapa (nová, náhled)</title>
<!-- MAPA_UX_2 ČÁST C: experimentální kopie, noindex, nikde neodkazovaná. Živá mapa = mapa.html. -->
<meta name="description" content="Chytrý košík. Pilot mapy.">
<meta name="theme-color" content="#120726">
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;1,800;1,900&amp;family=Yellowtail&amp;display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--pink:#FF2E97;--cyan:#2de2e6;--lime:#c8e84b;--ink:#0b0318}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#120726;color:#fff;font-family:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;font-size:17px;line-height:1.5;display:flex;flex-direction:column;min-height:100vh}
header{position:relative;z-index:1000;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 20px;background:linear-gradient(180deg,#1b0b4a,#120726);border-bottom:2px solid var(--pink);box-shadow:0 2px 24px rgba(255,46,151,.4)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:38px;height:38px;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 0 8px rgba(255,255,255,.4))}
.brand span{font-family:'Yellowtail',cursive;font-size:30px;color:#fff0f8;text-shadow:0 0 6px var(--pink),0 0 18px var(--pink)}
.tag{font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:#eaffff;text-shadow:0 0 8px var(--cyan)}
.spacer{flex:1 1 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:2px solid var(--cyan);background:#150628;color:#fff;font:600 15px 'Barlow Semi Condensed',Arial,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .2s,box-shadow .2s}
.chip:hover{box-shadow:0 0 16px var(--cyan)}
.chip.on{background:var(--cyan);color:#150628}
.seg{display:inline-flex;border:2px solid var(--pink);border-radius:999px;overflow:hidden;background:#150628}
.segbtn{min-height:40px;padding:0 18px;border:0;background:transparent;color:#fff;font:800 15px 'Barlow Semi Condensed',Arial,sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;transition:background .2s}
.segbtn.on{background:var(--pink);color:#160a33;text-shadow:none}
.segbtn:not(.on):hover{box-shadow:inset 0 0 14px rgba(255,46,151,.4)}
.locbtn{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--lime);color:#150628;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.locbtn:hover{box-shadow:0 0 22px var(--lime)}
.wrap{flex:1 1 auto;position:relative;min-height:440px}
#map{position:absolute;inset:0;background:#07031a}
/* GTA neon pop na vektorovou mapu.
   MAPY_UX_5: celoplosny CSS filtr na canvas se prekresluje KAZDY snimek (hlavni skubani na slabem GPU).
   Neon barvy ale drzi primo paint vrstev (NEON/applyOrientation), takze filtr jen lehce dobarvuje.
   Zapina se jen kdyz prohlizec umi GPU akceleraci levne (telo dostane tridu .neonfx), jinak se vynecha. */
body.neonfx .maplibregl-canvas{filter:saturate(1.15) contrast(1.04)}
.maplibregl-ctrl-attribution{background:rgba(11,3,24,.72)!important}
.maplibregl-ctrl-attribution a{color:var(--lime)!important}
.maplibregl-ctrl-group{background:#160a33!important;border:1px solid rgba(45,226,230,.5)!important;box-shadow:0 0 14px rgba(45,226,230,.35)!important}
.maplibregl-ctrl-group button+button{border-top:1px solid rgba(45,226,230,.3)!important}
.maplibregl-ctrl-group button span{filter:invert(1)}
/* popup */
.maplibregl-popup-content{background:#160a33;color:#fff;border:2px solid var(--pink);box-shadow:0 0 26px rgba(255,46,151,.5);border-radius:14px;padding:14px 16px}
.maplibregl-popup-tip{border-top-color:#160a33!important;border-bottom-color:#160a33!important}
.maplibregl-popup-close-button{color:#cbb9ef;font-size:20px;padding:2px 8px}
.pop-chain{font-weight:900;font-style:italic;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;text-shadow:0 0 12px currentColor}
.pop-venue{font-weight:900;font-style:italic;font-size:21px;line-height:1.12;text-shadow:0 0 12px currentColor}
.pop-store{color:#fff;font-weight:700;font-size:15px;margin-top:2px}
.pop-addr{color:#cbb9ef;font-size:13px;margin:3px 0 10px}
.times{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;align-items:center;gap:8px}
.trow b{display:inline-flex;align-items:center;gap:6px;min-width:70px;color:#eaffff;font-weight:700}
.trow .v{font-weight:600}
.muted{color:#9f8fc4}
/* uzivatelska poloha (MAPA_UX_2 C8: GTA sipka kdyz zname smer, jinak tecka) */
.me-dot{width:18px;height:18px;border-radius:50%;background:#c8e84b;box-shadow:0 0 0 3px #0d0626,0 0 16px #c8e84b;position:relative}
.me-dot.hasdir{background:transparent;box-shadow:none;width:0;height:0}
.me-dot.hasdir::before{content:"";position:absolute;left:-11px;top:-14px;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:26px solid #c8e84b;transform:rotate(var(--rot,0deg));transform-origin:50% 70%;filter:drop-shadow(0 0 8px #c8e84b)}
.me-dot.hasdir::after{content:"";position:absolute;left:-5px;top:0;width:10px;height:10px;border-radius:50%;background:#0d0626}
/* pulz vybraneho mista (C7) */
.sel-pulse{width:16px;height:16px;border-radius:50%;pointer-events:none}
.sel-pulse.go{animation:ckpulse 1.1s ease-out 2}
@keyframes ckpulse{0%{box-shadow:0 0 0 0 rgba(255,46,151,.7)}100%{box-shadow:0 0 0 26px rgba(255,46,151,0)}}
/* tlacitko 3D (C5) */
.btn3d{position:absolute;right:12px;bottom:118px;z-index:620;width:44px;height:44px;border-radius:12px;border:2px solid var(--cyan);background:#160a33;color:#eaffff;font:900 italic 15px 'Barlow Semi Condensed',Arial,sans-serif;cursor:pointer;box-shadow:0 0 14px rgba(45,226,230,.35)}
.btn3d:hover{box-shadow:0 0 18px var(--cyan)}
.btn3d.on{background:var(--cyan);color:#150628}
/* legenda (MAPA_UX: defaultne skryta, otevira ji tlacitko legbtn; radek = solo filtr klikem) */
.legtoggle{position:absolute;left:12px;bottom:12px;z-index:600;min-height:38px;padding:0 14px;border-radius:999px;border:2px solid var(--cyan);background:rgba(18,8,46,.92);color:#eaffff;font:700 14px 'Barlow Semi Condensed',Arial,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:0 0 14px rgba(45,226,230,.3)}
.legtoggle:hover{box-shadow:0 0 18px var(--cyan)}
.legtoggle.on{background:var(--cyan);color:#150628}
.legend{position:absolute;left:12px;bottom:58px;z-index:600;background:rgba(14,6,36,.92);border:1px solid rgba(45,226,230,.45);border-radius:12px;padding:8px 10px;backdrop-filter:blur(4px);box-shadow:0 0 18px rgba(45,226,230,.25);max-width:180px;display:none}
.legend.open{display:block}
.legend .lh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 6px}
.legend h4{margin:0;font:800 12px/1 'Barlow Semi Condensed',Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#eaffff;text-shadow:0 0 8px var(--cyan)}
.legend .lx{background:none;border:0;color:#cbb9ef;font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
.legend .row{display:flex;align-items:center;gap:8px;font-size:13px;color:#e9e0ff;margin:2px 0;padding:3px 5px;border-radius:8px;cursor:pointer}
.legend .row:hover{background:rgba(45,226,230,.12)}
.legend .row.sel{background:rgba(45,226,230,.2);box-shadow:inset 0 0 0 1px rgba(45,226,230,.55)}
.legend .d{width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font:900 11px 'Barlow Semi Condensed',Arial,sans-serif;color:#0b0318}
/* MAPA_UX: chip aktivniho filtru nahore (ukaze co je zapnute, klik = reset na Vse) */
.afilter{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:650;display:none;align-items:center;gap:8px;min-height:36px;padding:0 6px 0 14px;border-radius:999px;border:2px solid var(--pink);background:rgba(18,8,46,.96);color:#fff0f8;font:700 14px 'Barlow Semi Condensed',Arial,sans-serif;cursor:pointer;box-shadow:0 0 16px rgba(255,46,151,.4);max-width:80vw}
.afilter.on{display:inline-flex}
.afilter:hover{box-shadow:0 0 22px rgba(255,46,151,.6)}
.afilter .aflabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.afilter .afx{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:rgba(255,46,151,.25);font-size:16px;line-height:1}
/* filtr panel (jako Na ovoce) */
.panel{position:absolute;right:12px;top:12px;z-index:700;width:244px;background:rgba(18,8,46,.96);border:2px solid var(--cyan);border-radius:16px;box-shadow:0 0 30px rgba(45,226,230,.4);overflow:hidden;display:none}
.panel.open{display:block}
.panel .ph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(180deg,#241056,#160a33);border-bottom:1px solid rgba(45,226,230,.3)}
.panel .ph h3{margin:0;font:800 italic 16px 'Barlow Semi Condensed',Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:#eaffff;text-shadow:0 0 8px var(--cyan)}
.panel .x{background:none;border:0;color:#cbb9ef;font-size:22px;line-height:1;cursor:pointer;padding:0 2px}
.panel .list{padding:8px 6px;max-height:50vh;overflow:auto}
.panel label{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:16px;color:#f2ecff}
.panel label:hover{background:rgba(45,226,230,.1)}
.panel .d{width:22px;height:22px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font:900 13px 'Barlow Semi Condensed',Arial,sans-serif;color:#0b0318}
.panel .nm{flex:1 1 auto;font-weight:600}
.panel input[type=checkbox]{width:22px;height:22px;accent-color:var(--cyan);cursor:pointer}
.panel .foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid rgba(45,226,230,.3)}
.panel .foot button{flex:1 1 auto;min-height:42px;border-radius:999px;font:800 14px 'Barlow Semi Condensed',Arial,sans-serif;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;border:2px solid var(--cyan);background:#150628;color:#eaffff}
.panel .foot .save{border:0;background:var(--lime);color:#150628;font-style:italic}
.panel .foot button:hover{box-shadow:0 0 16px var(--cyan)}
.panel .foot .save:hover{box-shadow:0 0 18px var(--lime)}
/* vyhledavac */
.search{position:absolute;left:12px;top:12px;z-index:650;width:260px;max-width:70vw}
.searchbar{display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;background:rgba(18,8,46,.96);border:2px solid var(--cyan);border-radius:999px;box-shadow:0 0 18px rgba(45,226,230,.35)}
.searchbar svg{color:var(--cyan);flex:0 0 auto}
.searchbar input{flex:1 1 auto;background:none;border:0;outline:none;color:#fff;font:600 16px 'Barlow Semi Condensed',Arial,sans-serif}
.searchbar input::placeholder{color:#9f8fc4}
.searchres{display:none;margin-top:6px;background:rgba(18,8,46,.98);border:1px solid rgba(45,226,230,.4);border-radius:12px;overflow:hidden;box-shadow:0 0 22px rgba(45,226,230,.3);max-height:46vh;overflow-y:auto}
.searchres.open{display:block}
.sr{padding:9px 12px;cursor:pointer;border-bottom:1px solid rgba(45,226,230,.12)}
.sr:hover{background:rgba(45,226,230,.12)}
.sr b{display:block;font-weight:700;color:#fff;font-size:15px}
.sr span{display:block;color:#b9a9e0;font-size:12px}
.sr-empty{padding:10px 12px;color:#9f8fc4;font-size:14px}
/* popup odznak urovne */
.pop-meta{color:#cbb9ef;font-size:13px;margin:3px 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:1px 8px;border:1.5px solid;border-radius:999px;font-weight:800;font-size:11px;letter-spacing:.02em;text-shadow:0 0 8px currentColor}
/* skupinove nadpisy ve filtru/legende + prstencova tecka */
.pcap{padding:8px 12px 2px;font:800 12px 'Barlow Semi Condensed',Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#9fe9ec}
.legcap{margin:6px 0 2px;font:800 11px 'Barlow Semi Condensed',Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#9fe9ec}
.legend .d.ring,.panel .d.ring{background:transparent!important}
/* pivni stezky: selektor tras + info box (zvlastni zelena, GTA neon) */
#stezky{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);z-index:640;display:none;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;max-width:74vw;padding:6px 10px;background:rgba(18,8,46,.9);border:2px solid #8cff3a;border-radius:18px;box-shadow:0 0 18px rgba(140,255,58,.35)}
#stezky .stz-more{min-height:34px;padding:0 13px;border-radius:999px;border:2px dashed #8cff3a;background:transparent;color:#bfffa0;font:700 14px 'Barlow Semi Condensed',Arial,sans-serif;cursor:pointer}
#stezky.open{display:flex}
#stezky .stz-cap{font:800 13px 'Barlow Semi Condensed',Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#bfffa0}
#stezky .stz{min-height:34px;padding:0 13px;border-radius:999px;border:2px solid #8cff3a;background:#102a0c;color:#daffc8;font:700 14px 'Barlow Semi Condensed',Arial,sans-serif;cursor:pointer}
#stezky .stz.on{background:#8cff3a;color:#0b2206}
#stezky .stz:hover{box-shadow:0 0 14px rgba(140,255,58,.6)}
#stezka-info{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);z-index:640;display:none;flex-direction:column;align-items:center;gap:2px;padding:8px 16px;background:rgba(14,6,36,.92);border:1.5px solid #8cff3a;border-radius:12px;box-shadow:0 0 18px rgba(140,255,58,.3);text-align:center;max-width:80vw}
#stezka-info.open{display:flex}
#stezka-info b{font:900 16px 'Barlow Semi Condensed',Arial,sans-serif;font-style:italic;color:#aaff85;text-shadow:0 0 10px rgba(140,255,58,.5)}
#stezka-info span{font-size:13px;color:#dfeee0}
/* MAPA_UX_2: tlacitko Pivni stezky (styl Legendy, zelena) */
.stezbtn{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:620;display:none;min-height:38px;padding:0 16px;border-radius:999px;border:2px solid #8cff3a;background:rgba(16,42,12,.92);color:#daffc8;font:700 14px 'Barlow Semi Condensed',Arial,sans-serif;cursor:pointer;align-items:center;gap:7px;box-shadow:0 0 14px rgba(140,255,58,.3)}
.stezbtn.show{display:inline-flex}
.stezbtn:hover{box-shadow:0 0 18px rgba(140,255,58,.6)}
.stezbtn.on{background:#8cff3a;color:#0b2206}
/* MAPY_UX_7: Co je blizko = mala futuristicka plovouci karta v rohu (ne spodni lista pres celou sirku).
   Polopruhledna, neonovy ram, ukaze par nejblizsich mist najednou (3-4 kompaktni radky), uvnitr scroll. */
.nearby{position:absolute;left:12px;top:66px;z-index:655;width:244px;max-width:72vw;max-height:66vh;display:none;flex-direction:column;background:rgba(14,6,36,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border:1.5px solid var(--cyan);border-radius:16px;box-shadow:0 0 22px rgba(45,226,230,.45),inset 0 0 20px rgba(45,226,230,.08);overflow:hidden}
.nearby.open{display:flex}
.nearby .nh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 6px 12px;border-bottom:1px solid rgba(45,226,230,.22)}
.nearby .nh b{font:800 italic 13px 'Barlow Semi Condensed',Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:#eaffff;text-shadow:0 0 8px var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nearby .nx{flex:0 0 auto;background:none;border:0;color:#cbb9ef;font-size:19px;line-height:1;cursor:pointer;padding:0 2px}
.nearby .nlist{overflow-y:auto;overflow-x:hidden;padding:4px;max-height:300px}
.nearby .nr{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:9px;cursor:pointer}
.nearby .nr:hover{background:rgba(45,226,230,.14)}
.nearby .nr+.nr{border-top:1px solid rgba(45,226,230,.08)}
.nearby .nr .d{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font:900 11px 'Barlow Semi Condensed',Arial,sans-serif;color:#0b0318}
.nearby .nr .nm{flex:1 1 auto;min-width:0}
.nearby .nr .nm b{display:block;font-weight:700;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nearby .nr .nm span{display:block;color:#b9a9e0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nearby .nr .dist{flex:0 0 auto;color:var(--lime);font-weight:800;font-size:12px}
.nearby .nfoot{display:none}
.nearby .nfoot.show{display:block;padding:6px 8px 8px;border-top:1px solid rgba(45,226,230,.18)}
.nearby .nfoot button{width:100%;min-height:32px;border-radius:999px;border:1.5px solid var(--cyan);background:rgba(21,6,40,.6);color:#eaffff;font:700 12px 'Barlow Semi Condensed',Arial,sans-serif;text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.nearby .nfoot button:hover{box-shadow:0 0 14px var(--cyan)}
.nearby .nempty{padding:12px 10px;color:#9f8fc4;font-size:13px;text-align:center}
/* MAPA_UX_2: toast */
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:900;display:none;max-width:80vw;padding:11px 18px;background:rgba(14,6,36,.96);border:2px solid var(--pink);border-radius:12px;color:#fff0f8;font:700 15px 'Barlow Semi Condensed',Arial,sans-serif;text-align:center;box-shadow:0 0 24px rgba(255,46,151,.5)}
.toast.show{display:block}
/* MAPA_UX_2: navigacni tlacitka v okne mista (Google Mapy) */
.navrow{display:flex;gap:6px;margin-top:10px}
.navbtn{flex:1 1 0;display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:10px;border:2px solid var(--cyan);background:#150628;color:#eaffff;font:800 12px 'Barlow Semi Condensed',Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;text-decoration:none;cursor:pointer}
.navbtn:hover{box-shadow:0 0 14px var(--cyan)}
.navbtn svg{width:18px;height:18px}
/* MAPY_UX_3/4: maly odkaz Google Mapy v okne mista (cela navigace venku) */
.navall{display:block;text-align:center;margin-top:8px;color:#9fe9ec;font-size:13px;text-decoration:underline}
/* MAPY_UX_5: uzky pruh trasy — JEN zbyvajici cas + vzdalenost + krizek (zadne kroky, nic neprekryva mapu) */
.routebar{position:absolute;left:12px;right:12px;bottom:12px;z-index:670;display:none}
.routebar.show{display:block}
.routebar .rbar{display:flex;align-items:center;gap:10px;min-height:52px;max-height:56px;padding:0 8px 0 14px;background:rgba(18,8,46,.97);border:2px solid var(--lime);border-radius:16px;box-shadow:0 0 24px rgba(200,232,75,.3)}
.routebar .rbar .ric{flex:0 0 auto;font-size:20px;line-height:1}
.routebar .rbar .rtxt{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:10px;line-height:1.12}
.routebar .rbar .rtxt b{font:900 italic 18px 'Barlow Semi Condensed',Arial,sans-serif;color:#eaffff;text-shadow:0 0 8px var(--lime);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.routebar .rbar .rtxt span{color:#c8e84b;font-weight:700;font-size:14px;white-space:nowrap}
.routebar .rbar .rgm{flex:0 0 auto;color:var(--lime);font-size:13px;text-decoration:underline;white-space:nowrap}
.routebar .rbar .rxc{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:2px solid var(--pink);background:#150628;color:#ffd9f3;font-size:20px;line-height:1;cursor:pointer}
.routebar .rbar .rxc:hover{box-shadow:0 0 14px rgba(255,46,151,.5)}
/* MAPY_UX_4: pri aktivni trase zdvihni ovladani u spodniho okraje, at je pruh nezakryva */
.wrap.routing .legtoggle,.wrap.routing .stezbtn{bottom:76px}
.wrap.routing #stezky{bottom:122px}
.wrap.routing #stezka-info{bottom:176px}
.wrap.routing .maplibregl-ctrl-bottom-right{margin-bottom:64px}
/* MAPY_UX_3: napoveda ke shlukum nad mapou (poprve) */
.clusterhint{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:850;display:none;max-width:84vw;padding:10px 16px;background:rgba(14,6,36,.96);border:2px solid var(--cyan);border-radius:12px;color:#eaffff;font:600 14px 'Barlow Semi Condensed',Arial,sans-serif;text-align:center;box-shadow:0 0 22px rgba(45,226,230,.4)}
.clusterhint.show{display:block}
.legend .legnote{margin-top:8px;padding-top:6px;border-top:1px solid rgba(45,226,230,.25);font-size:11px;color:#9f8fc4;line-height:1.3}
@media (max-width:620px){.tag{display:none}.legend{left:8px}.legtoggle{left:8px}.panel{right:8px;left:8px;width:auto}.search{top:8px;left:8px}.afilter{top:62px}#stezky{bottom:58px;max-width:94vw}#stezka-info{bottom:112px}.nearby{left:8px}.routebar{left:8px;right:8px}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#"><img src="/img/logo-mark.png" alt="Chytrý košík"><span>Chytrý košík</span></a>
  <span class="spacer"></span>
  <div class="seg" role="tablist">
    <button type="button" class="segbtn on" id="modeObchody">Obchody</button>
    <button type="button" class="segbtn" id="modePodniky">Podniky</button>
  </div>
  <div class="chips">
    <button type="button" class="chip" id="allbtn">Vše</button>
    <button type="button" class="chip on" id="filterbtn">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M6 12h12M10 19h4"></path></svg>
      Filtry
    </button>
    <button type="button" class="chip" id="nearbtn">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"></path><circle cx="12" cy="10" r="2.4"></circle></svg>
      V mém okolí
    </button>
  </div>
  <button type="button" class="locbtn" id="locbtn">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
    Moje poloha
  </button>
</header>

<div class="wrap">
  <div id="map"></div>

  <!-- Vyhledavac -->
  <div class="search">
    <div class="searchbar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.2-4.2"></path></svg>
      <input type="text" id="search" placeholder="Hledat na mapě…" autocomplete="off">
    </div>
    <div class="searchres" id="searchres"></div>
  </div>

  <!-- Filtr: nastavit vyber retezcu (jako Na ovoce) -->
  <div class="panel" id="panel">
    <div class="ph"><h3>Nastavit výběr</h3><button type="button" class="x" id="panelx" aria-label="Zavřít">&times;</button></div>
    <div class="list" id="panellist"></div>
    <div class="foot">
      <button type="button" id="selall">Vybrat vše</button>
      <button type="button" class="save" id="save">Uložit</button>
    </div>
  </div>

  <!-- Legenda (MAPA_UX): defaultne skryta, otevira ji tlacitko; klik na radek = solo filtr -->
  <button type="button" class="legtoggle" id="legbtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>Legenda</button>
  <div class="legend" id="legend">
    <div class="lh"><h4>Řetězce</h4><button type="button" class="lx" id="legx" aria-label="Zavřít">&times;</button></div>
    <div id="legendrows"></div>
  </div>

  <!-- Pivni stezky: selektor tras (jen rezim Podniky) + info o trase -->
  <div id="stezky"></div>
  <div id="stezka-info"></div>

  <!-- MAPA_UX: chip aktivniho filtru (ukaze co je zapnute, klik = reset na Vse) -->
  <button type="button" class="afilter" id="afilter"></button>

  <!-- MAPA_UX_2: Pivni stezky — tlacitko ve stylu Legendy, otevira spodni listu (default zavreno) -->
  <button type="button" class="stezbtn" id="stezbtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h8a3 3 0 0 1 0 6h-1"></path><path d="M6 8h9M6 8v9a2 2 0 0 0 2 2h3a2 2 0 0 0 2-2"></path></svg>Pivní stezky</button>

  <!-- MAPY_UX_7: Co je blizko — mala plovouci karta v rohu, par nejblizsich mist najednou -->
  <div class="nearby" id="nearby">
    <div class="nh"><b id="nearbytitle">V mém okolí</b><button type="button" class="nx" id="nearbyx" aria-label="Zavřít">&times;</button></div>
    <div class="nlist" id="nearbylist"></div>
    <div class="nfoot" id="nearbyfoot"></div>
  </div>

  <!-- MAPA_UX_2 C5: tlacitko 3D (vychozi vyp) -->
  <button type="button" class="btn3d" id="btn3d">3D</button>

  <!-- MAPY_UX_4: uzky pruh trasy (nahrazuje velky panel) -->
  <div class="routebar" id="routep"></div>

  <!-- MAPY_UX_3: napoveda ke shlukum (poprve, sama zmizi) -->
  <div class="clusterhint" id="clusterhint"></div>

  <!-- MAPA_UX_2: kratka hlaska (poloha se nepodarila apod.) -->
  <div class="toast" id="toast"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function(){
  var PRAHA = [14.4378, 50.0755]; // [lon,lat] pro MapLibre
  var CHAINS = ['Lidl','Albert','Kaufland','Penny','Billa','Tesco','Globus'];
  var COLORS = {
    Lidl:'#ffd400', Albert:'#1f8bff', Kaufland:'#ff2d2d', Penny:'#ff2ec4',
    Billa:'#ff8a1e', Tesco:'#25e05a', Globus:'#a65cff'
  };
  var LS_KEY = 'ck_mapa_filtr';

  // nacteni ulozeneho vyberu (default = vse)
  var active = {};
  CHAINS.forEach(function(c){ active[c]=true; });
  try{
    var saved = JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(saved && typeof saved==='object'){ CHAINS.forEach(function(c){ active[c] = saved[c]!==false; }); }
  }catch(e){}

  // MAPA_UX: vynuceny rezim (appka ma dve samostatne mapy). URL ?mode=obchody|podniky nebo
  // injectovana promenna window.__MAPA_FORCE_MODE__. Pri vynuceni se skryje prepinac Obchody/Podniky.
  // Bez parametru (web) = kombinovana mapa s prepinacem jako dnes.
  var FORCE_MODE = null;
  try{ var _mm = new URLSearchParams(location.search).get('mode'); if(_mm==='obchody'||_mm==='podniky') FORCE_MODE=_mm; }catch(e){}
  if(!FORCE_MODE){ var _wm = window.__MAPA_FORCE_MODE__; if(_wm==='obchody'||_wm==='podniky') FORCE_MODE=_wm; }
  if(FORCE_MODE){ var _seg=document.querySelector('.seg'); if(_seg) _seg.style.display='none'; }

  // MAPA_UX_2 A1: v appce (vynuceny rezim nebo ?embed=1) schovej logo a nazev; na webu zustava.
  var IN_APP = !!FORCE_MODE;
  try{ if(new URLSearchParams(location.search).get('embed')==='1') IN_APP=true; }catch(e){}
  if(IN_APP){ var _br=document.querySelector('.brand'); if(_br) _br.style.display='none'; }

  // MAPA_UX_2: kratka hlaska (toast)
  var _toastT=null;
  function toast(msg){
    var el=document.getElementById('toast'); if(!el) return;
    el.textContent=msg; el.classList.add('show');
    if(_toastT) clearTimeout(_toastT);
    _toastT=setTimeout(function(){ el.classList.remove('show'); }, 3200);
  }
  // MAPA_UX_2: vzdalenost dvou bodu [lat,lon] v metrech (haversine)
  function distM(a, b){
    var R=6371000, toR=Math.PI/180;
    var dLat=(b[0]-a[0])*toR, dLon=(b[1]-a[1])*toR;
    var la1=a[0]*toR, la2=b[0]*toR;
    var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
  }
  function fmtDist(m){ return m<950 ? Math.round(m/10)*10+' m' : (m/1000).toFixed(m<9500?1:0).replace('.',',')+' km'; }
  // MAPA_UX_2: polygon kruhu o polomeru rM metru kolem [lon,lat] (pro kruh presnosti)
  function circlePolygon(lon, lat, rM){
    var pts=[], n=64, dLat=rM/111320, dLon=rM/(111320*Math.cos(lat*Math.PI/180));
    for(var i=0;i<=n;i++){ var t=2*Math.PI*i/n; pts.push([lon+dLon*Math.cos(t), lat+dLat*Math.sin(t)]); }
    return {type:'Feature', geometry:{type:'Polygon', coordinates:[pts]}, properties:{}};
  }

  // MAPY_UX_5: na kapabilnim zarizeni zapni lehky neon CSS filtr (viz .neonfx), na slabem ho vynech.
  // Celoplosny filtr se prekresluje kazdy snimek -> na slabem GPU hlavni skubani pri posunu.
  // Slabe = softwarove vykreslovani (stary PC bez/se spatnym ovladacem GPU -> SwiftShader/llvmpipe),
  // malo jader, malo pameti, nebo uzivatel chce omezeny pohyb.
  function _softwareGL(){
    try{
      var c=document.createElement('canvas'); var gl=c.getContext('webgl')||c.getContext('experimental-webgl');
      if(!gl) return true;
      var ext=gl.getExtension('WEBGL_debug_renderer_info');
      var r=(ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):'')||''; r=(''+r).toLowerCase();
      return r.indexOf('swiftshader')>=0||r.indexOf('llvmpipe')>=0||r.indexOf('software')>=0||r.indexOf('basic render')>=0;
    }catch(e){ return false; }
  }
  try{
    var _weak = _softwareGL() ||
                (navigator.deviceMemory && navigator.deviceMemory < 4) ||
                (navigator.hardwareConcurrency && navigator.hardwareConcurrency < 4) ||
                (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    if(!_weak) document.body.classList.add('neonfx');
  }catch(e){ try{ document.body.classList.add('neonfx'); }catch(e2){} }

  var map = new maplibregl.Map({
    container:'map',
    style:'https://tiles.openfreemap.org/styles/dark', // OpenFreeMap: zdarma, bez klice, bez limitu
    center:PRAHA, zoom:11, attributionControl:false, hash:false,
    fadeDuration:0 // MAPY_UX_5: bez prolinani popisku = min prekreslovani pri posunu (plynulejsi na slabem stroji)
  });
  map.addControl(new maplibregl.AttributionControl({compact:true, customAttribution:'prodejny a trasy: OpenStreetMap (ODbL), OSRM'}));
  map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'bottom-right');

  // ---- GTA neon prebarveni (svitici silnice magenta/cyan, tmava voda) ----
  var NEON = {
    'background':            {'background-color':'#07031a'},
    'water':                 {'fill-color':'#0c2742'},
    'water_name':            {},
    'highway_motorway_casing':{'line-color':'#ff2e97','line-blur':4,'line-opacity':0.45,'line-width':['interpolate',['linear'],['zoom'],8,2,16,14]},
    'highway_motorway_inner': {'line-color':'#ff8fd1','line-blur':0.5,'line-opacity':0.98},
    'highway_motorway_subtle':{'line-color':'#8a1f5a','line-opacity':0.6},
    'highway_major_casing':  {'line-color':'#ff2e97','line-blur':3,'line-opacity':0.32},
    'highway_major_inner':   {'line-color':'#ff6ec0','line-blur':0.4,'line-opacity':0.92},
    'highway_major_subtle':  {'line-color':'#5c2449','line-opacity':0.7},
    'highway_minor':         {'line-color':'#2de2e6','line-blur':0.5,'line-opacity':0.82},
    'highway_path':          {'line-color':'#1f8a9c','line-opacity':0.45},
    'railway':               {'line-color':'#7a3cff','line-opacity':0.5},
    'railway_transit':       {'line-color':'#7a3cff','line-opacity':0.4}
  };
  function applyNeon(){
    Object.keys(NEON).forEach(function(id){
      if(!map.getLayer(id)) return;
      var props = NEON[id];
      Object.keys(props).forEach(function(p){
        try{ map.setPaintProperty(id, p, props[p]); }catch(e){}
      });
    });
  }

  // ---- zvyraznene nazvy mist (GTA nadech): tucne, svetle neon + tmave halo ----
  // Font: OpenFreeMap glyphy nabizi jen Noto Sans Regular/Bold -> pouzivame Noto Sans Bold.
  //   Pravy Pricedown by vyzadoval vlastni SDF glyphy (viz report).
  var PLACE_COLOR='#ffd9f3', PLACE_HALO='#0a0418'; // svetle ruzova na tmavem halo
  var STREET_COLOR='#ffffff', STREET_HALO='#07031a';
  // velke celky driv, ulice az pri priblizeni
  var LABELS = {
    // ctvrti / obce / mesta
    'place_city_large':{z:[3,24], size:['interpolate',['linear'],['zoom'],4,15,10,24], paint:1},
    'place_city':      {z:[5,24], size:['interpolate',['linear'],['zoom'],6,14,12,21], paint:1},
    'place_town':      {z:[8,24], size:['interpolate',['linear'],['zoom'],8,13,13,19], paint:1},
    'place_suburb':    {z:[10,24],size:['interpolate',['linear'],['zoom'],10,13,15,20], paint:1},
    'place_village':   {z:[11,24],size:['interpolate',['linear'],['zoom'],11,12,15,17], paint:1},
    'place_other':     {z:[13,24],size:['interpolate',['linear'],['zoom'],13,11,16,16], paint:1},
    // ulice az od vetsiho priblizeni
    'highway_name_motorway':{z:[13,24], size:['interpolate',['linear'],['zoom'],13,11,18,15], street:1},
    'highway_name_other':   {z:[14,24], size:['interpolate',['linear'],['zoom'],14,11,18,15], street:1}
  };
  function applyLabels(){
    Object.keys(LABELS).forEach(function(id){
      if(!map.getLayer(id)) return;
      var c=LABELS[id];
      try{ map.setLayerZoomRange(id, c.z[0], c.z[1]); }catch(e){}
      // ceske nazvy s fallbackem (name:cs -> name:latin -> name)
      try{ map.setLayoutProperty(id,'text-field',['coalesce',['get','name:cs'],['get','name:latin'],['get','name']]); }catch(e){}
      try{ map.setLayoutProperty(id,'text-font',['Noto Sans Bold']); }catch(e){}
      try{ map.setLayoutProperty(id,'text-size', c.size); }catch(e){}
      if(c.paint){ try{ map.setLayoutProperty(id,'text-letter-spacing',0.04); }catch(e){} }
      var col = c.street?STREET_COLOR:PLACE_COLOR;
      var halo= c.street?STREET_HALO:PLACE_HALO;
      try{ map.setPaintProperty(id,'text-color',col); }catch(e){}
      try{ map.setPaintProperty(id,'text-halo-color',halo); }catch(e){}
      try{ map.setPaintProperty(id,'text-halo-width', c.street?1.8:2.2); }catch(e){}
      try{ map.setPaintProperty(id,'text-halo-blur', 0.4); }catch(e){}
    });
    // ceske nazvy statu a admin. celku (Czechia -> Česko, Slovakia -> Slovensko) - jen lokalizace textu, vzhled vrstvy beze zmeny
    ['place_country_major','place_country_minor','place_country_other','place_state','place_continent'].forEach(function(id){
      if(!map.getLayer(id)) return;
      try{ map.setLayoutProperty(id,'text-field',['coalesce',['get','name:cs'],['get','name:latin'],['get','name']]); }catch(e){}
    });
  }

  // ---- data + body ----
  function fmtMin(sec){ if(sec==null) return null; var m=Math.round(sec/60); return m<1?'<1 min':m+' min'; }

  function route(profilePath, prof, a, b){ // a,b = [lat,lon]; FOSSGIS verejny OSRM
    var url='https://routing.openstreetmap.de/'+profilePath+'/route/v1/'+prof+'/'+a[1]+','+a[0]+';'+b[1]+','+b[0]+'?overview=false';
    return fetch(url).then(function(r){return r.json();}).then(function(j){
      return (j && j.routes && j.routes[0]) ? j.routes[0].duration : null;
    }).catch(function(){return null;});
  }

  var userLoc = null, userMarker = null;
  // MAPY_UX_4: aktualni otevrene okno mista a jeho zdrojovy zaznam (pro zavreni pri trase/prepnuti a znovuotevreni u cile)
  var currentPopup = null, lastPlace = null;
  function closeCurrentPopup(){ if(currentPopup){ try{ currentPopup.remove(); }catch(e){} currentPopup=null; } }
  function trackPopup(pop, place){ currentPopup=pop; lastPlace=place; pop.on('close', function(){ if(currentPopup===pop){ currentPopup=null; } }); }

  // MAPY_UX_3: navigacni tlacitka kreslí trasu v NASI mape (uz neodchazi do Google Map).
  // MHD se presunulo do panelu trasy jako maly textovy odkaz.
  function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  // MAPY_UX_4: MHD = zatim odkaz do Google Map (travelmode=transit); Otevrit v Google Mapach = cela navigace venku.
  // Sev pro vlastni rezim MHD zustava v ROUTE_MODES (viz nize).
  function gmDir(lat, lon, travel){
    var u='https://www.google.com/maps/dir/?api=1&destination='+lat+','+lon;
    if(travel) u+='&travelmode='+travel;
    if(userLoc) u+='&origin='+userLoc[0]+','+userLoc[1];
    return u;
  }
  function navButtonsHtml(lat, lon, name){
    var walk='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="1.6"></circle><path d="M11 21l1.5-6 2.5 2v4M11 15l-1.5-5 4-1 2 3 2.5 1"></path></svg>';
    var car='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2-5a2 2 0 0 1 2-1.3h8A2 2 0 0 1 18 8l2 5v5h-3v-2H7v2H4z"></path><circle cx="7.5" cy="15.5" r="0.6"></circle><circle cx="16.5" cy="15.5" r="0.6"></circle></svg>';
    var bus='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="13" rx="2"></rect><path d="M5 11h14"></path><circle cx="8" cy="20" r="0.6"></circle><circle cx="16" cy="20" r="0.6"></circle><path d="M8 17v2M16 17v2"></path></svg>';
    var da='data-lat="'+lat+'" data-lon="'+lon+'" data-name="'+escAttr(name)+'"';
    return '<div class="navrow">'+
      '<button type="button" class="navbtn" data-route="foot" '+da+'>'+walk+'Pěšky</button>'+
      '<button type="button" class="navbtn" data-route="car" '+da+'>'+car+'Autem</button>'+
      '<a class="navbtn" href="'+gmDir(lat,lon,'transit')+'" target="_blank" rel="noopener">'+bus+'MHD</a>'+
    '</div>'+
    '<a class="navall" href="'+gmDir(lat,lon,'')+'" target="_blank" rel="noopener">Otevřít v Google Mapách</a>';
  }

  function popupHtml(s){
    var color = COLORS[s.retezec]||'#2de2e6';
    var store = (s.nazev && s.nazev!==s.retezec) ? '<div class="pop-store">'+s.nazev+'</div>' : '';
    return '<div class="pop-chain" style="color:'+color+'">'+s.retezec+'</div>'+ store +
      (s.adresa?'<div class="pop-addr">'+s.adresa+'</div>':'')+
      '<div class="times">'+
        '<div class="trow"><b>🚶 Pěšky</b><span class="v" data-foot>—</span></div>'+
        '<div class="trow"><b>🚗 Autem</b><span class="v" data-car>—</span></div>'+
      '</div>'+
      navButtonsHtml(s.lat, s.lon, s.retezec + (s.nazev && s.nazev!==s.retezec ? ' · '+s.nazev : ''));
  }
  function fillTimes(s, popupEl){
    if(!popupEl) return;
    var footEl = popupEl.querySelector('[data-foot]');
    var carEl  = popupEl.querySelector('[data-car]');
    if(!userLoc){
      if(footEl) footEl.innerHTML='<span class="muted">zapni Moje poloha</span>';
      if(carEl)  carEl.innerHTML='<span class="muted">zapni Moje poloha</span>';
      return;
    }
    if(footEl) footEl.textContent='…';
    if(carEl)  carEl.textContent='…';
    var dest=[s.lat,s.lon];
    route('routed-foot','foot',userLoc,dest).then(function(d){ if(footEl) footEl.textContent=fmtMin(d)||'nedostupné'; });
    route('routed-car','driving',userLoc,dest).then(function(d){ if(carEl) carEl.textContent=fmtMin(d)||'nedostupné'; });
  }

  // ======== Rezimy: Obchody (stores) + Podniky (venues) ========
  var mode = 'obchody'; // 'obchody' | 'podniky'

  // Podniky: TYP (barva spendliku) + UROVEN (odznak = prstenec)
  var VT_LABEL = {restaurace:'Restaurace', kavarna:'Kavárna', pivnice:'Pivnice', bistro:'Bistro', cukrarna:'Cukrárna', reznictvi:'Řeznictví', obchod:'Obchod', trh:'Trh', vyrobce:'Výrobce', pivovar:'Pivovar', hospoda:'Hospoda', zmrzlinarna:'Zmrzlinárna', rychle_obcerstveni:'Rychlé občerstvení', pekarna:'Pekárna', vinoteka:'Vinotéka', lahudky:'Lahůdky', cajovna:'Čajovna'};
  var VT_INI   = {restaurace:'R', kavarna:'K', pivnice:'P', bistro:'B', cukrarna:'C', reznictvi:'Ř', obchod:'O', trh:'T', vyrobce:'V', pivovar:'Pv', hospoda:'H', zmrzlinarna:'Z', rychle_obcerstveni:'Ro', pekarna:'Pk', vinoteka:'Vi', lahudky:'L', cajovna:'Č'};
  var VT_COLOR = {restaurace:'#ff4b4b', kavarna:'#ff9e2c', pivnice:'#f2d20c', bistro:'#2ee6c6', cukrarna:'#ff6ad5', reznictvi:'#ff3d6e', obchod:'#35a0ff', trh:'#7a6bff', vyrobce:'#9be52e', pivovar:'#e8961e', hospoda:'#b5794a', zmrzlinarna:'#7fd4ff', rychle_obcerstveni:'#ff6a1a', pekarna:'#e8c65a', vinoteka:'#b04dff', lahudky:'#3bd99a', cajovna:'#4ab0b8'};
  var VT_ORDER = ['restaurace','kavarna','pivnice','bistro','cukrarna','reznictvi','obchod','trh','vyrobce','pivovar','hospoda','zmrzlinarna','rychle_obcerstveni','pekarna','vinoteka','lahudky','cajovna'];
  var VU_LABEL = {michelin:'Michelin', gault:'Gault & Millau', bib:'Bib Gourmand', vyber_ck:'Chytrý výběr', pivni_stezka:'Pivní stezka'};
  var VU_SHORT = {michelin:'★ Michelin', gault:'Gault & Millau', bib:'Bib Gourmand', vyber_ck:'Chytrý výběr', pivni_stezka:'Pivní stezka'};
  var VU_COLOR = {michelin:'#ffd700', gault:'#e5e4e2', bib:'#cd7f32', vyber_ck:'#ffffff', pivni_stezka:'#58c93a'}; // prstenec/odznak
  var VU_ORDER = ['michelin','gault','bib','vyber_ck','pivni_stezka'];

  var ROUTE_COLOR = '#8cff3a'; // trasa pivni stezky (vazba na uroven Pivni stezka, odlisna od silnic a bodu)
  var STEZKY = [], STEZKA_BY_KEY = {}, activeStezka = null;

  // aktivni mnoziny (naplni se z dat po nacteni; default vse zaskrtnuto)
  var activeVT = {}, activeVU = {};
  var VT_PRESENT = [], VU_PRESENT = [];
  // MAPY_UX_8: typy, co se zakaznikovi nenabizi ve filtru (na mape zustavaji). Drzime je vzdy zapnute.
  var VT_FILTER_HIDE = {trh:1, vyrobce:1};
  var VT_FILTER = []; // typy nabizene ve filtru/legende (bez skrytych)
  function initVenueFilters(){
    var ts={}, us={};
    ALLV.forEach(function(v){ ts[v.typ]=1; (v.oceneni&&v.oceneni.length?v.oceneni:['vyber_ck']).forEach(function(a){ us[a]=1; }); });
    VT_PRESENT = VT_ORDER.filter(function(t){ return ts[t]; });
    VT_FILTER = VT_PRESENT.filter(function(t){ return !VT_FILTER_HIDE[t]; });
    VU_PRESENT = VU_ORDER.filter(function(u){ return us[u]; });
    var svt=null, svu=null;
    try{ svt=JSON.parse(localStorage.getItem(LS_VT)||'null'); }catch(e){}
    try{ svu=JSON.parse(localStorage.getItem(LS_VU)||'null'); }catch(e){}
    VT_PRESENT.forEach(function(t){ activeVT[t] = svt&&typeof svt==='object' ? svt[t]!==false : true; });
    // skryte typy (Vyrobce, Trh) nejde ve filtru vypnout -> drz je zapnute i proti stare localStorage
    VT_PRESENT.forEach(function(t){ if(VT_FILTER_HIDE[t]) activeVT[t]=true; });
    VU_PRESENT.forEach(function(u){ activeVU[u] = svu&&typeof svu==='object' ? svu[u]!==false : true; });
  }

  var ALL = [];  // prodejny
  var ALLV = []; // podniky

  function storesFC(){
    return {type:'FeatureCollection', features:ALL.filter(function(s){ return active[s.retezec]; }).map(function(s){
      return {type:'Feature', geometry:{type:'Point', coordinates:[s.lon,s.lat]},
        properties:{nazev:s.nazev, retezec:s.retezec, adresa:s.adresa||'', color:COLORS[s.retezec]||'#2de2e6', ini:(s.retezec||'?').charAt(0)}};
    })};

  function ocOf(v){ return (v.oceneni && v.oceneni.length) ? v.oceneni.slice().sort() : ['vyber_ck']; }
  function venuesFC(){
    return {type:'FeatureCollection', features:ALLV.filter(function(v){
      return activeVT[v.typ] && ocOf(v).some(function(a){ return activeVU[a]; }) && !(activeStezka && v.stezka===activeStezka);
    }).map(function(v){
      var oc=ocOf(v), rep=oc[0], graded=oc.some(function(a){ return a!=='vyber_ck'; })?1:0;
      return {type:'Feature', geometry:{type:'Point', coordinates:[v.lon,v.lat]},
        properties:{nazev:v.nazev, typ:v.typ, oceneni:oc.join(','), graded:graded, adresa:v.adresa||'', mesto:v.mesto||'', stezka:v.stezka||'',

  function popupVenueHtml(v){

    var oc = Array.isArray(v.oceneni) ? v.oceneni.slice() : (v.oceneni ? String(v.oceneni).split(',') : ['vyber_ck']);
    oc.sort(); // pevne neutralni poradi (abecedni), Michelin neni prvni

  }

  // MAPY_UX_6: klik na číselný shluk přiblíží na jeho oblast a rozpadne ho (zoom na expansion-zoom).
  // MapLibre v4 vrací getClusterExpansionZoom jako Promise (callback forma z v3 je no-op = shluk „nereagoval").
  // Držíme obě formy + plynulý easeTo + fallback (zoom+2.5), aby klik VŽDY něco udělal.
  function zoomToCluster(srcId, f){
    var src=map.getSource(srcId); if(!src || !f) return;
    var cid=f.properties.cluster_id, c=f.geometry.coordinates.slice(), done=false;
    function go(z){ if(done) return; done=true;
      var cur=map.getZoom();
      var zoom=(z!=null && isFinite(z)) ? z : cur+2.5;
      // velke shluky vraci expansion-zoom <= aktualni zoom -> klik by nic neudelal; vzdy se znatelne priblizit
      if(zoom <= cur+0.5) zoom = cur+2.5;
      zoom=Math.min(zoom, 20);
      map.easeTo({center:c, zoom:zoom, duration:650});
    }
    try{
      var p=src.getClusterExpansionZoom(cid, function(err,z){ if(!err) go(z); }); // v3 callback
      if(p && typeof p.then==='function') p.then(go).catch(function(){ go(null); }); // v4 Promise
    }catch(e){ go(null); }
  }
  function wireClusterLayers(ids, srcId){
    ids.forEach(function(id){
      map.on('click', id, function(e){ if(e.features && e.features[0]) zoomToCluster(srcId, e.features[0]); });
      map.on('mouseenter', id, function(){ map.getCanvas().style.cursor='pointer'; });
      map.on('mouseleave', id, function(){ map.getCanvas().style.cursor=''; });
    });
  }

    }, paint:{'text-color':'#ffffff', 'text-halo-color':'#2a0a3a', 'text-halo-width':1.6, 'text-halo-blur':0.3}});

    // jednotlivy spendlik: zare
    map.addLayer({id:'pt-glow', type:'circle', source:'stores', filter:['!',['has','point_count']], paint:{

    }});
    // jednotlivy spendlik: jadro v barve retezce
    map.addLayer({id:'points', type:'circle', source:'stores', filter:['!',['has','point_count']], paint:{

      'circle-stroke-width':1.6, 'circle-stroke-color':'#ffffff', 'circle-stroke-opacity':0.9
    }});
    // ikona = inicial retezce
    map.addLayer({id:'pt-label', type:'symbol', source:'stores', filter:['!',['has','point_count']], layout:{

    }, paint:{'text-color':'#0b0318'}});
    // nazev retezce u spendliku (jako Google), az pri priblizeni; nepreklada se, pri oddaleni zmizi
    map.addLayer({id:'pt-name', type:'symbol', source:'stores', filter:['!',['has','point_count']], minzoom:14, layout:{
      'text-field':['get','retezec'], 'text-font':['Noto Sans Bold'],

    map.on('click','points',function(e){

    map.on('click','v-points',function(e){
      var f=e.features[0], p=f.properties, c=f.geometry.coordinates.slice();

      var pop=new maplibregl.Popup({offset:16, maxWidth:'280px'}).setLngLat(c).setHTML(popupVenueHtml(v)).addTo(map);

    ['v-points'].forEach(function(id){
      map.on('mouseenter',id,function(){ map.getCanvas().style.cursor='pointer'; });

  // ======== Pivni stezky jako trasy ========
  var STEZKA_LAYERS=['stezka-line-glow','stezka-line','stezka-stop-glow','stezka-stop','stezka-stop-num'];
  // MAPY_UX_7: trasa vede PŘÍMO přes zastávky (= konkrétní podniky), ne po silnici vedle nich.
  // Zastávky mají stejné souřadnice jako podniky (ověřeno: stop == venue), předpočítaná OSRM geometrie
  // se ale snapuje na silnici a driftovala až 263 m od značky podniku (Trautenberk). Proto čáru skládáme
  // z bodů zastávek seřazených podle pořadí n -> zelená čára sedí přesně na značky podniků, co do stezky patří.
  function stezkaFC(s){
    if(!s) return {type:'FeatureCollection', features:[]};
    var stops=(s.stops||[]).slice().sort(function(a,b){ return (a.n||0)-(b.n||0); });
    var coords=stops.map(function(st){ return [st.lon, st.lat]; });
    var feats=[];
    if(coords.length>1){ feats.push({type:'Feature', geometry:{type:'LineString', coordinates:coords}, properties:{kind:'line'}}); }
    stops.forEach(function(st){ feats.push({type:'Feature', geometry:{type:'Point', coordinates:[st.lon,st.lat]}, properties:{kind:'stop', n:String(st.n), nazev:st.nazev}}); });
    return {type:'FeatureCollection', features:feats};
  }
  function addStezkaLayers(){
    map.addSource('stezka', {type:'geojson', data:stezkaFC(null)});
    map.addLayer({id:'stezka-line-glow', type:'line', source:'stezka', filter:['==',['get','kind'],'line'],
      layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-color':ROUTE_COLOR, 'line-width':['interpolate',['linear'],['zoom'],8,6,16,16], 'line-blur':4, 'line-opacity':0.4}});
    map.addLayer({id:'stezka-line', type:'line', source:'stezka', filter:['==',['get','kind'],'line'],
      layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-color':ROUTE_COLOR, 'line-width':['interpolate',['linear'],['zoom'],8,2.5,16,6], 'line-opacity':0.98}});
    map.addLayer({id:'stezka-stop-glow', type:'circle', source:'stezka', filter:['==',['get','kind'],'stop'],
      paint:{'circle-color':ROUTE_COLOR, 'circle-radius':15, 'circle-blur':1, 'circle-opacity':0.5}});
    map.addLayer({id:'stezka-stop', type:'circle', source:'stezka', filter:['==',['get','kind'],'stop'],
      paint:{'circle-color':ROUTE_COLOR, 'circle-radius':12, 'circle-stroke-width':2, 'circle-stroke-color':'#0b0318', 'circle-stroke-opacity':0.9}});
    map.addLayer({id:'stezka-stop-num', type:'symbol', source:'stezka', filter:['==',['get','kind'],'stop'],
      layout:{'text-field':['get','n'], 'text-font':['Noto Sans Bold'], 'text-size':13, 'text-allow-overlap':true},
      paint:{'text-color':'#0b2206'}});
    map.on('click','stezka-stop',function(e){
      var p=e.features[0].properties, c=e.features[0].geometry.coordinates.slice();
      new maplibregl.Popup({offset:14, maxWidth:'260px'}).setLngLat(c).setHTML('<div class="pop-venue" style="color:'+ROUTE_COLOR+'">'+p.n+'. '+p.nazev+'</div>').addTo(map);
    });
    map.on('mouseenter','stezka-stop',function(){ map.getCanvas().style.cursor='pointer'; });
    map.on('mouseleave','stezka-stop',function(){ map.getCanvas().style.cursor=''; });
  }
  function renderStezkaInfo(s){
    var box=document.getElementById('stezka-info');
    if(!box) return;
    if(!s){ box.classList.remove('open'); box.innerHTML=''; return; }
    var icon = s.profile==='foot' ? '🚶 pěšky' : '🚗 autem';
    box.innerHTML='<b>'+s.name+'</b><span>'+icon+' · '+String(s.distance_km).replace('.',',')+' km · '+s.duration_min+' min · '+(s.stops||[]).length+' zastávek</span>';
    box.classList.add('open');
  }
  // MAPA_UX_2 A5: stezky skryte za tlacitkem (default zavreno), razeni podle vyrezu mapy,
  // vzdalene (>60 km od stredu) pod "Dalsi stezky".
  var stezkyOpen=false, stezkyShowMore=false;
  function stezkaCenterDist(s){
    var c=map.getCenter(), o=[c.lat,c.lng], best=Infinity;
    (s.stops||[]).forEach(function(st){ var d=distM(o,[st.lat,st.lon]); if(d<best) best=d; });
    if(best===Infinity && s.geometry && s.geometry.coordinates){ s.geometry.coordinates.forEach(function(cc){ var d=distM(o,[cc[1],cc[0]]); if(d<best) best=d; }); }
    return best;
  }
  function updateStezbtn(){
    var b=document.getElementById('stezbtn'); if(!b) return;
    var show = mode==='podniky' && STEZKY.length;
    b.classList.toggle('show', !!show);
    if(!show) stezkyOpen=false;
    b.classList.toggle('on', stezkyOpen && !!show);
  }
  function buildStezkaChips(){
    var bar=document.getElementById('stezky'); if(!bar) return;
    bar.innerHTML='';
    updateStezbtn();
    if(mode!=='podniky' || !STEZKY.length || !stezkyOpen){ bar.classList.remove('open'); return; }
    bar.classList.add('open');
    var sorted=STEZKY.slice().sort(function(a,b){ return stezkaCenterDist(a)-stezkaCenterDist(b); });
    var near=sorted.filter(function(s){ return stezkaCenterDist(s)<=60000; });
    var far =sorted.filter(function(s){ return stezkaCenterDist(s) >60000; });
    var cap=document.createElement('span'); cap.className='stz-cap'; cap.textContent='Pivní stezky:'; bar.appendChild(cap);
    function addChip(s){
      var btn=document.createElement('button'); btn.type='button';
      btn.className='stz'+(activeStezka===s.key?' on':'');
      btn.textContent=s.name;
      btn.addEventListener('click',function(){ activeStezka===s.key ? clearStezka() : selectStezka(s.key); });
      bar.appendChild(btn);
    }
    (near.length?near:sorted).forEach(addChip);       // kdyz je vse dal nez 60 km, ukaz aspon nejblizsi
    var rest = near.length ? far : [];
    if(rest.length && !stezkyShowMore){
      var more=document.createElement('button'); more.type='button'; more.className='stz-more';
      more.textContent='Další stezky ('+rest.length+')';
      more.addEventListener('click',function(){ stezkyShowMore=true; buildStezkaChips(); });
      bar.appendChild(more);
    } else if(rest.length && stezkyShowMore){
      rest.forEach(addChip);
    }
  }
  function selectStezka(key){
    var s=STEZKA_BY_KEY[key]; if(!s) return;
    activeStezka=key;
    var src=map.getSource('stezka'); if(src) src.setData(stezkaFC(s));
    var v=map.getSource('venues'); if(v) v.setData(venuesFC()); // rozklastruj: odeber body teto stezky z clusteru
    renderStezkaInfo(s); buildStezkaChips();
    var b=new maplibregl.LngLatBounds();
    (s.geometry.coordinates||[]).forEach(function(c){ b.extend(c); });
    (s.stops||[]).forEach(function(st){ b.extend([st.lon,st.lat]); });

  // presnosti + s akceptaci starsi polohy. Chybu hlasime jen kdyz polohu NEMAME vubec.
  function requestFix(onOk){
    if(!navigator.geolocation){ if(!userLoc) toast('Polohu se nepodařilo zjistit'); return; }

    }, {enableHighAccuracy:true, timeout:8000, maximumAge:30000});

  function isSolo(group, key){

    if(vt.length===1 && allVU) return VT_LABEL[vt[0]]||vt[0];
    if(vu.length===1 && allVT) return VU_LABEL[vu[0]]||vu[0];

    if(!allVT) parts.push(vt.length===1?(VT_LABEL[vt[0]]||vt[0]):(vt.length+' typů'));

  // ===================== MAPY_UX_3: trasa nakreslena v nasi mape =====================
  // FOSSGIS verejny OSRM (routing.openstreetmap.de): zdarma, bez klice, max 1 pozadavek/s, zadny scraping.
  // routed-foot = profil pesi, routed-car = profil auto; overview=full&geometries=geojson&steps=true vraci
  // geometrii i kroky. Pri selhani: hlaska + nahradni odkaz do Google Map (jen v tomto pripade).
  var ROUTE_HL='#ffe53a';              // svitiva zluto-limetka, odlisna od silnic (ruzova/cyan) i vody
  var routeState=null;                 // {dest:{lat,lon,name}, profile:'foot'|'car', geometry, steps, distance, duration, reopen}
  var routeWaitClick=false, routePendingDest=null, routePendingProfile=null, watchId=null;
  // MAPY_UX_4/5: sledovani polohy (mapa drzi polohu ve vyrezu), prubeh po trase (uz bez krokoveho seznamu)
  var followMode=false, routeCum=null, routeProgIdx=0, routePendingReopen=null;

  var ROUTE_DONE='#4a5c6e';            // ujita cast trasy — tlumena (zbyvajici sviti ROUTE_HL)
  function ensureRouteLayers(){
    if(map.getSource('route')) return;
    map.addSource('route', {type:'geojson', data:{type:'FeatureCollection',features:[]}});
    // MAPY_UX_4: ujita cast trasy (tlumena) pod svitici zbyvajici
    map.addLayer({id:'route-done', type:'line', source:'route', filter:['==',['get','kind'],'done'],

    map.addLayer({id:'route-glow', type:'line', source:'route', filter:['==',['get','kind'],'line'],
      layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-color':ROUTE_HL,'line-width':['interpolate',['linear'],['zoom'],10,8,16,20],'line-blur':5,'line-opacity':0.45}});
    map.addLayer({id:'route-line', type:'line', source:'route', filter:['==',['get','kind'],'line'],
      layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-color':ROUTE_HL,'line-width':['interpolate',['linear'],['zoom'],10,4,16,9],'line-opacity':0.98}});
    map.addLayer({id:'route-dest-glow', type:'circle', source:'route', filter:['==',['get','kind'],'dest'],
      paint:{'circle-color':ROUTE_HL,'circle-radius':17,'circle-blur':1,'circle-opacity':0.5}});
    map.addLayer({id:'route-dest', type:'circle', source:'route', filter:['==',['get','kind'],'dest'],
      paint:{'circle-color':ROUTE_HL,'circle-radius':9,'circle-stroke-width':2.6,'circle-stroke-color':'#0b0318','circle-stroke-opacity':0.95}});
    // MAPY_UX_4: nazev cile u znacky, at okno nemusi zustat otevrene
    map.addLayer({id:'route-dest-name', type:'symbol', source:'route', filter:['==',['get','kind'],'dest'],
      layout:{'text-field':['get','name'],'text-font':['Noto Sans Bold'],'text-size':13,'text-offset':[0,1.4],'text-anchor':'top','text-allow-overlap':true,'text-optional':true},
      paint:{'text-color':'#eaffff','text-halo-color':'#07031a','text-halo-width':2,'text-halo-blur':0.3}});
    // MAPY_UX_4: klepnuti na znacku cile znovu otevre okno mista
    map.on('click','route-dest', reopenRouteDest);
    map.on('mouseenter','route-dest',function(){ map.getCanvas().style.cursor='pointer'; });
    map.on('mouseleave','route-dest',function(){ map.getCanvas().style.cursor=''; });
  }
  function routeFC(){
    if(!routeState) return {type:'FeatureCollection',features:[]};
    var co=(routeState.geometry && routeState.geometry.coordinates) || [];
    var feats=[], idx=Math.max(0, Math.min(routeProgIdx, co.length-1));
    if(co.length>1 && idx>0){
      feats.push({type:'Feature', geometry:{type:'LineString', coordinates:co.slice(0, idx+1)}, properties:{kind:'done'}});
      feats.push({type:'Feature', geometry:{type:'LineString', coordinates:co.slice(idx)}, properties:{kind:'line'}});
    } else {
      feats.push({type:'Feature', geometry:routeState.geometry, properties:{kind:'line'}});
    }
    feats.push({type:'Feature', geometry:{type:'Point', coordinates:[routeState.dest.lon, routeState.dest.lat]}, properties:{kind:'dest', name:routeState.dest.name||''}});
    return {type:'FeatureCollection', features:feats};
  }
  function setRouteData(){ ensureRouteLayers(); var s=map.getSource('route'); if(s) s.setData(routeFC()); }
  // MAPY_UX_4: znovuotevreni okna mista u cile z puvodniho zaznamu (ulozen pri startu trasy)
  function reopenRouteDest(){
    if(!routeState || !routeState.reopen) return;
    var lp=routeState.reopen, c=[routeState.dest.lon, routeState.dest.lat];
    if(lp.kind==='store'){
      var pop=new maplibregl.Popup({offset:16, maxWidth:'280px'}).setLngLat(c).setHTML(popupHtml(lp.s)).addTo(map);
      trackPopup(pop, lp); fillTimes(lp.s, pop.getElement());
    } else {
      var pop2=new maplibregl.Popup({offset:16, maxWidth:'280px'}).setLngLat(c).setHTML(popupVenueHtml(lp.v)).addTo(map);
      trackPopup(pop2, lp);
    }
  }
  // MAPY_UX_4: prubeh po trase — nejblizsi bod geometrie, ujita/zbyvajici cast, cas a vzdalenost do cile, prichod, odklon
  function computeRouteCum(){
    routeCum=[0]; var co=(routeState.geometry && routeState.geometry.coordinates) || [];
    for(var i=1;i<co.length;i++){ routeCum.push(routeCum[i-1]+distM([co[i-1][1],co[i-1][0]],[co[i][1],co[i][0]])); }
  }
  function updateRouteProgress(){
    if(!routeState || !userLoc || !routeCum) return;
    var co=routeState.geometry.coordinates, best=Infinity, bi=0;
    for(var i=0;i<co.length;i++){ var d=distM(userLoc,[co[i][1],co[i][0]]); if(d<best){ best=d; bi=i; } }
    routeProgIdx=bi;
    // autem = sipka ve smeru trasy (kdyz nezname smer z kompasu); pesky zustava kolecko
    if(meEl && routeState.profile==='car' && meHeading==null && bi<co.length-1){
      var brg=bearing([co[bi][1],co[bi][0]],[co[bi+1][1],co[bi+1][0]]);
      meEl.classList.add('hasdir'); meEl.style.setProperty('--rot', Math.round(brg)+'deg');
    }
    setRouteData();
    // prichod do 30 m od cile
    if(distM(userLoc,[routeState.dest.lat, routeState.dest.lon]) < 30){ toast('Jsi na místě'); cancelRoute(); return; }
    var total=routeCum[routeCum.length-1]||routeState.distance||0;
    var remain=Math.max(0, total-routeCum[bi]);
    var remSec=(total>0)?routeState.duration*(remain/total):routeState.duration;
    updateRouteBarInfo(remSec, remain);
  }
  function bearing(a, b){ // a,b=[lat,lon] -> uhel ve stupnich (0=sever)
    var toR=Math.PI/180, toD=180/Math.PI;
    var y=Math.sin((b[1]-a[1])*toR)*Math.cos(b[0]*toR);
    var x=Math.cos(a[0]*toR)*Math.sin(b[0]*toR)-Math.sin(a[0]*toR)*Math.cos(b[0]*toR)*Math.cos((b[1]-a[1])*toR);
    return (Math.atan2(y,x)*toD+360)%360;
  }
  function updateRouteBarInfo(remSec, remM){
    var b=document.getElementById('rremain'), d=document.getElementById('rremdist');
    if(b) b.textContent=fmtMin(remSec)||'—';
    if(d) d.textContent=fmtDist(remM);
  }

  // Rezimy trasy jsou DATA-RIZENE (seznam). MAPY_UX_5: krokova navigace (turn-by-turn) odstranena na vyslovny
  // pokyn Patrika — uzivatel jde podle cary na mape, pruh ukazuje jen zbyvajici cas a vzdalenost.
  var ROUTE_MODES=[
    {key:'foot', label:'Pěšky', icon:'🚶', osrm:{path:'routed-foot', profile:'foot'}},
    {key:'car',  label:'Autem', icon:'🚗', osrm:{path:'routed-car',  profile:'driving'}}
  ];
  function modeOf(key){ for(var i=0;i<ROUTE_MODES.length;i++){ if(ROUTE_MODES[i].key===key) return ROUTE_MODES[i]; } return ROUTE_MODES[0]; }
  function fetchRoute(start, dest, profile){ // start,dest = [lat,lon]
    var o=modeOf(profile).osrm;
    // MAPY_UX_5: uz nechceme kroky (steps) — jen geometrii trasy, cas a vzdalenost. Mensi odpoved, nic navic.
    var url='https://routing.openstreetmap.de/'+o.path+'/route/v1/'+o.profile+'/'+
      start[1]+','+start[0]+';'+dest[1]+','+dest[0]+'?overview=full&geometries=geojson';
    return fetch(url).then(function(r){ return r.json(); }).then(function(j){
      if(!j || j.code!=='Ok' || !j.routes || !j.routes[0]) throw new Error('no route');
      var rt=j.routes[0];
      return {geometry:rt.geometry, distance:rt.distance, duration:rt.duration};
    });
  }

  function gmHref(dest, travel){
    var u='https://www.google.com/maps/dir/?api=1&destination='+dest.lat+','+dest.lon+'&travelmode='+travel;
    if(userLoc) u+='&origin='+userLoc[0]+','+userLoc[1];
    return u;
  }
  // MAPY_UX_4: nacitaci pruh
  function renderRouteLoading(dest){
    var box=document.getElementById('routep'); if(!box) return;
    box.className='routebar show';
    box.innerHTML='<div class="rbar"><span class="ric">⏳</span>'+
      '<span class="rtxt"><b>'+escAttr((dest&&dest.name)||'Cíl')+'</b><span>Počítám trasu…</span></span>'+
      '<button type="button" class="rxc" id="routecancel" aria-label="Zrušit">&times;</button></div>';
    var x=document.getElementById('routecancel'); if(x) x.addEventListener('click', function(e){ e.stopPropagation(); cancelRoute(); });
  }
  // MAPY_UX_5: pruh trasy = jen jedna radka (ikona rezimu + zbyvajici cas + vzdalenost + krizek). Zadne kroky.
  function renderRoutePanel(err){
    var box=document.getElementById('routep'); if(!box) return;
    var dest=(routeState?routeState.dest:routePendingDest)||{lat:0,lon:0,name:'Cíl'};
    if(err){
      box.className='routebar show';
      box.innerHTML='<div class="rbar"><span class="ric">⚠️</span>'+
        '<span class="rtxt"><b>Trasu se nepodařilo spočítat</b></span>'+
        '<a class="rgm" href="'+gmHref(dest, routePendingProfile==='car'?'driving':'walking')+'" target="_blank" rel="noopener">Google Mapy</a>'+
        '<button type="button" class="rxc" id="routecancel" aria-label="Zrušit">&times;</button></div>';
      document.getElementById('routecancel').addEventListener('click', function(e){ e.stopPropagation(); cancelRoute(); });
      return;
    }
    if(!routeState) return;
    var m=modeOf(routeState.profile);
    box.className='routebar show';
    box.innerHTML=
      '<div class="rbar">'+
        '<span class="ric">'+m.icon+'</span>'+
        '<span class="rtxt"><b id="rremain">'+(fmtMin(routeState.duration)||'—')+'</b><span id="rremdist">'+fmtDist(routeState.distance)+'</span></span>'+
        '<button type="button" class="rxc" id="routecancel" aria-label="Zrušit trasu">&times;</button>'+
      '</div>';
    document.getElementById('routecancel').addEventListener('click', function(e){ e.stopPropagation(); cancelRoute(); });
    updateRouteProgress(); // kdyz uz polohu zname, rovnou doplnit zbyvajici cas/vzdalenost
  }
  function fitRoute(){
    if(!routeState) return;
    var b=new maplibregl.LngLatBounds();
    (routeState.geometry.coordinates||[]).forEach(function(c){ b.extend(c); });
    b.extend([routeState.dest.lon, routeState.dest.lat]);
    if(userLoc) b.extend([userLoc[1], userLoc[0]]);
    // MAPY_UX_4: pruh trasy je uzky (~56 px), staci maly spodni padding, at trasa nezmizi za pruhem
    try{ map.fitBounds(b, {padding:{top:64,left:44,right:44,bottom:96}, maxZoom:16, duration:600}); }catch(e){}
  }
  function doRoute(dest, profile, start){
    routePendingDest=dest; routePendingProfile=profile;
    var reopen=(routeState && routeState.reopen) || routePendingReopen || null; // zachovej okno mista pri prepocitani
    renderRouteLoading(dest);
    fetchRoute(start, [dest.lat, dest.lon], profile).then(function(r){
      routeState={dest:dest, profile:profile, geometry:r.geometry, distance:r.distance, duration:r.duration, reopen:reopen};
      routeProgIdx=0; computeRouteCum(); followMode=true;                   // od startu sleduj polohu
      try{ document.querySelector('.wrap').classList.add('routing'); }catch(e){}
      setRouteData(); fitRoute(); renderRoutePanel(false);
    }).catch(function(){ routeState=null; setRouteData(); renderRoutePanel(true); }); // selhani: hlaska + nahradni odkaz, zadna chyba do konzole
  }
  function awaitClickStart(dest, profile){
    routeWaitClick=true; routePendingDest=dest; routePendingProfile=profile;
    toast('Klepni do mapy, odkud vyrážíš');
    map.getCanvas().style.cursor='crosshair';
  }
  function startRoute(dest, profile){
    routePendingReopen=lastPlace;  // MAPY_UX_4: zapamatuj okno mista pro znovuotevreni u cile
    closeCurrentPopup();           // MAPY_UX_4 (oprava 2.3): okno mista se pri startu samo zavre
    closeNearby(); closePanel();
    if(userLoc){ doRoute(dest, profile, userLoc); return; }                 // 1. uz znam polohu
    var ap=appLoc();
    if(ap){ setUserLocation(ap.lat, ap.lon, ap.acc, false); doRoute(dest, profile, [ap.lat, ap.lon]); return; } // 2. z appky
    if(navigator.geolocation){                                              // 3. zkus geolokaci prohlizece (dvoustupnove)
      toast('Hledám tvoji polohu…');
      startWatch();
      var gotFix=function(pos){ setUserLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, false); doRoute(dest, profile, userLoc); };
      navigator.geolocation.getCurrentPosition(gotFix, function(){
        navigator.geolocation.getCurrentPosition(gotFix, function(){ awaitClickStart(dest, profile); }, {enableHighAccuracy:false, timeout:12000, maximumAge:120000});
      }, {enableHighAccuracy:true, timeout:8000, maximumAge:30000});
    } else { awaitClickStart(dest, profile); }                             // 4. klepnuti do mapy = start
  }
  function cancelRoute(){
    routeState=null; routeWaitClick=false; routePendingDest=null; routePendingReopen=null;
    routeCum=null; routeProgIdx=0; followMode=false;
    map.getCanvas().style.cursor='';
    try{ document.querySelector('.wrap').classList.remove('routing'); }catch(e){}
    setRouteData();
    var box=document.getElementById('routep'); if(box){ box.className='routebar'; box.innerHTML=''; }
  }
  function startWatch(){
    if(IN_APP || watchId!=null || !navigator.geolocation) return; // v appce chodi poloha pres mapa:poloha (cast B)
    try{ watchId=navigator.geolocation.watchPosition(function(pos){
      setUserLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, false);
    }, function(){}, {enableHighAccuracy:true, maximumAge:10000, timeout:15000}); }catch(e){}
  }
  // navigacni tlacitka z popupu (delegovane, popup se renderuje jako HTML)
  document.addEventListener('click', function(e){
    var b=e.target && e.target.closest ? e.target.closest('[data-route]') : null;
    if(!b) return;
    e.preventDefault();
    startRoute({lat:parseFloat(b.getAttribute('data-lat')), lon:parseFloat(b.getAttribute('data-lon')), name:b.getAttribute('data-name')||''}, b.getAttribute('data-route'));
  });
  // start = prvni klepnuti do mapy, kdyz polohu nezname
  map.on('click', function(e){
    if(!routeWaitClick) return;
    routeWaitClick=false; map.getCanvas().style.cursor='';
    setUserLocation(e.lngLat.lat, e.lngLat.lng, 0, false);
    doRoute(routePendingDest, routePendingProfile, [e.lngLat.lat, e.lngLat.lng]);
  });

  // ===================== MAPY_UX_3: napoveda ke shlukum (poprve) =====================
  function maybeClusterHint(){
    try{ if(localStorage.getItem('ck_mapa_hint_shluky')==='1') return; }catch(e){}
    var el=document.getElementById('clusterhint'); if(!el) return;
    el.textContent='Kruh = počet míst v oblasti. Klepni a přiblíží se.';
    el.classList.add('show');
    var ht=null;
    function hide(){ el.classList.remove('show'); try{ localStorage.setItem('ck_mapa_hint_shluky','1'); }catch(e){} if(ht) clearTimeout(ht); map.off('click', hide); }
    ht=setTimeout(hide, 6000);
    map.on('click', hide);
  }

  // ---- Vyhledavac (hleda v aktualnim rezimu) ----
  var searchInput=document.getElementById('search');
  var searchRes=document.getElementById('searchres');
  function clearSearch(){ if(searchInput) searchInput.value=''; if(searchRes){ searchRes.innerHTML=''; searchRes.classList.remove('open'); } }
  function selectResult(it){
    map.flyTo({center:[it.lon,it.lat], zoom:16});
    if(it.kind==='store'){
      var s={nazev:it.row.nazev, retezec:it.row.retezec, adresa:it.row.adresa, lon:it.lon, lat:it.lat};
      var pop=new maplibregl.Popup({offset:16, maxWidth:'280px'}).setLngLat([it.lon,it.lat]).setHTML(popupHtml(s)).addTo(map);
      trackPopup(pop, {kind:'store', s:s});
      fillTimes(s, pop.getElement());
    } else {
      var pop2=new maplibregl.Popup({offset:16, maxWidth:'280px'}).setLngLat([it.lon,it.lat]).setHTML(popupVenueHtml(it.row)).addTo(map);
      trackPopup(pop2, {kind:'venue', v:it.row});
    }
    searchRes.classList.remove('open');
    searchInput.value=it.name;
  }
  function doSearch(){
    var q=(searchInput.value||'').trim().toLowerCase();
    searchRes.innerHTML='';
    if(q.length<2){ searchRes.classList.remove('open'); return; }
    var items=[];
    if(mode==='obchody'){
      ALL.forEach(function(s){ if(((s.nazev||'')+' '+(s.adresa||'')).toLowerCase().indexOf(q)>=0) items.push({name:s.nazev, sub:s.adresa||s.retezec, lon:s.lon, lat:s.lat, kind:'store', row:s}); });
    } else {
      ALLV.forEach(function(v){ if((v.nazev||'').toLowerCase().indexOf(q)>=0) items.push({name:v.nazev, sub:VT_LABEL[v.typ]||'', lon:v.lon, lat:v.lat, kind:'venue', row:v}); });
    }
    items=items.slice(0,8);
    if(!items.length){ searchRes.innerHTML='<div class="sr-empty">Nic nenalezeno</div>'; searchRes.classList.add('open'); return; }
    items.forEach(function(it){
      var r=document.createElement('div'); r.className='sr';
      r.innerHTML='<b>'+it.name+'</b><span>'+(it.sub||'')+'</span>';
      r.addEventListener('click', function(){ selectResult(it); });
      searchRes.appendChild(r);
    });
    searchRes.classList.add('open');
  }
  if(searchInput){
    searchInput.addEventListener('input', doSearch);
    searchInput.addEventListener('focus', function(){ if(searchRes.children.length) searchRes.classList.add('open'); });
    document.addEventListener('click', function(e){ if(!e.target.closest('.search')) searchRes.classList.remove('open'); });
  }
})();
</script>
