<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chytrý košík: připravujeme</title>
<meta name="description" content="Chytrý košík: připravujeme pro tebe appku, která ti poradí, co uvařit, kolik to stojí a kde nakoupíš nejlevněji. Brzy spustíme.">
<meta name="theme-color" content="#120726">
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;1,800;1,900&amp;family=Yellowtail&amp;display=swap" rel="stylesheet">
<style>
:root{--pink:#FF2E97;--cyan:#2de2e6;--lime:#c8e84b}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#120726;color:#fff;font-family:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;font-size:18px;line-height:1.55;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;background:radial-gradient(900px 500px at 50% 10%,rgba(123,47,247,.35),transparent 70%),#120726}
a{color:var(--lime)}a:hover{color:#fff}
.wrap{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;max-width:620px}
.logo{width:clamp(96px,22vw,148px);height:auto;filter:drop-shadow(0 0 22px rgba(200,232,75,.45))}
.name{font-family:'Yellowtail',cursive;font-size:clamp(56px,12vw,128px);line-height:1;color:#fff0f8;text-shadow:0 0 6px var(--pink),0 0 18px var(--pink),0 0 44px var(--pink)}
.lead{margin:0;font-size:clamp(18px,2.4vw,22px);font-weight:500;color:#e6dcff}
.soon{margin:0;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.08em;color:#eaffff;text-shadow:0 0 6px var(--cyan),0 0 18px var(--cyan)}
.contact{margin:6px 0 0;font-size:17px;color:#d5c9f2}
.contact a{font-weight:600}
</style>
</head>
<body>
<main class="wrap">
<img class="logo" src="/img/logo.png" alt="Chytrý košík">
<div class="name">Chytrý košík</div>
<p class="lead">Připravujeme pro tebe appku, která ti poradí, co uvařit, kolik to stojí a kde nakoupíš nejlevněji.</p>
<p class="soon">Brzy spustíme.</p>
<p class="contact">Napiš nám: <a href="mailto:chytrykosik@gmail.com">chytrykosik@gmail.com</a></p>
</main>
</body>
</html>
